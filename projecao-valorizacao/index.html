<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projeção de Valorização — Praia Digital</title>
<meta name="description" content="Projete a valorização do seu imóvel no litoral paulista em 1, 5 e 10 anos.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:700px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1.2rem;font-size:.95rem}
  label{display:block;font-weight:600;font-size:.85rem;margin:.9rem 0 .3rem}
  input,select{width:100%;padding:.7rem;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem}
  button{width:100%;margin-top:1.3rem;padding:.9rem;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  #out{display:none;margin-top:1.3rem}
  .ano{display:flex;align-items:center;gap:.8rem;margin-top:.7rem;font-size:.92rem}
  .ano b{width:60px}
  .trilha{flex:1;height:22px;background:#e2e8f0;border-radius:99px;overflow:hidden}
  .trilha div{height:100%;background:linear-gradient(90deg,#0077B6,#00B4D8);display:flex;align-items:center;justify-content:flex-end;padding-right:.6rem;color:#fff;font-size:.78rem;font-weight:700;min-width:70px;transition:width .5s}
  .dica{margin-top:1.2rem;background:#ecfeff;border:1px solid #67e8f9;border-radius:12px;padding:1rem;font-size:.9rem}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/avaliador-imoveis">← Avaliador IA</a>
</header>
<main>
  <div class="card">
    <h1>📈 Projeção de Valorização</h1>
    <p class="sub">Quanto seu imóvel pode valer em 1, 5 e 10 anos?</p>
    <label>Valor atual do imóvel (R$)</label>
    <input type="number" id="valor" value="500000" step="50000">
    <label>Cidade (taxa de valorização anual estimada)</label>
    <select id="cidade">
      <option value="0.145">Bertioga (14,5%/ano)</option><option value="0.131">Praia Grande (13,1%/ano)</option>
      <option value="0.126">Peruíbe (12,6%/ano)</option><option value="0.114">Guarujá (11,4%/ano)</option>
      <option value="0.102">Mongaguá (10,2%/ano)</option><option value="0.098">Itanhaém (9,8%/ano)</option>
      <option value="0.092">Santos (9,2%/ano)</option><option value="0.087">São Vicente (8,7%/ano)</option>
    </select>
    <button onclick="proj()">Projetar</button>
    <div id="out"></div>
    <div class="dica">⚖️ Compare cidades no <a href="https://praia.digital/guia-litoral/comparador-cidades/" style="color:#0077B6;font-weight:700">Comparador de Cidades</a> · 📊 Indicadores no <a href="https://praia.digital/apps/painel-mercado/" style="color:#0077B6;font-weight:700">Painel de Mercado</a></div>
  </div>
</main>
<script>
var fmt=function(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})};
function proj(){
  var v=parseFloat(document.getElementById('valor').value)||0;
  var t=parseFloat(document.getElementById('cidade').value);
  var anos=[1,5,10], max=v*Math.pow(1+t,10), h='';
  anos.forEach(function(a){
    var f=v*Math.pow(1+t,a);
    h+='<div class="ano"><b>'+a+' ano'+(a>1?'s':'')+'</b><div class="trilha"><div style="width:'+(f/max*100)+'%">'+fmt(f)+'</div></div></div>';
  });
  h+='<p style="margin-top:.9rem;font-size:.85rem;color:#64748b">Ganho de capital em 10 anos: <b style="color:#166534">'+fmt(max-v)+'</b> (projeção estimada, sem garantia)</p>';
  document.getElementById('out').innerHTML=h;
  document.getElementById('out').style.display='block';
}
</script>
</body>
</html>
