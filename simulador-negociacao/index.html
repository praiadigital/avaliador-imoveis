<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Negociação — Praia Digital</title>
<meta name="description" content="Quanto oferecer abaixo do preço pedido? Estratégia de negociação com dados do mercado do litoral.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:680px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1.2rem;font-size:.95rem}
  label{display:block;font-weight:600;font-size:.85rem;margin:.9rem 0 .3rem}
  input,select{width:100%;padding:.7rem;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem}
  button{width:100%;margin-top:1.3rem;padding:.9rem;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  #out{display:none;margin-top:1.3rem}
  .step{border-left:4px solid #0077B6;background:#f8fafc;border-radius:0 10px 10px 0;padding:.9rem 1rem;margin-top:.7rem;font-size:.93rem}
  .step b{color:#0077B6}
  .dica{margin-top:1.2rem;background:#ecfeff;border:1px solid #67e8f9;border-radius:12px;padding:1rem;font-size:.9rem}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/avaliador-imoveis">← Avaliador IA</a>
</header>
<main>
  <div class="card">
    <h1>🤝 Simulador de Negociação</h1>
    <p class="sub">Estratégia de oferta em 3 lances, baseada no tempo de anúncio e no mercado.</p>
    <label>Preço pedido (R$)</label><input type="number" id="pedido" value="550000" step="10000">
    <label>Tempo anunciado</label>
    <select id="tempo"><option value="0.03">Menos de 30 dias (anúncio novo)</option><option value="0.06">1–3 meses</option><option value="0.09">3–6 meses</option><option value="0.13">Mais de 6 meses (vendedor motivado)</option></select>
    <label>Mercado da cidade</label>
    <select id="mercado"><option value="0.97">Quente (Bertioga, Praia Grande)</option><option value="1">Equilibrado</option><option value="1.03">Frio (Itanhaém, São Vicente)</option></select>
    <button onclick="calc()">Montar estratégia</button>
    <div id="out"></div>
    <div class="dica">📏 Verifique se o preço pedido está justo no <a href="https://praia.digital/avaliador-imoveis" style="color:#0077B6;font-weight:700">Avaliador IA</a> antes de negociar.</div>
  </div>
</main>
<script>
function calc(){
  var p=parseFloat(document.getElementById('pedido').value)||0;
  var t=parseFloat(document.getElementById('tempo').value);
  var m=parseFloat(document.getElementById('mercado').value);
  var fmt=function(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})};
  var descontoMax=t*m;
  var l1=p*(1-descontoMax), l2=p*(1-descontoMax*0.6), l3=p*(1-descontoMax*0.3);
  document.getElementById('out').innerHTML=
    '<div class="step"><b>Lance 1 — Abertura ('+fmt(l1)+'):</b> Comece '+Math.round(descontoMax*100)+'% abaixo. Justifique com dados de mercado, nunca com opinião. Espere silêncio — quem fala primeiro perde.</div>'+
    '<div class="step"><b>Lance 2 — Concessão ('+fmt(l2)+'):</b> Suba ~40% da distância e peça algo em troca (inclusão de mobília, prazo maior, documentação por conta do vendedor).</div>'+
    '<div class="step"><b>Lance 3 — Fechamento ('+fmt(l3)+'):</b> Seu teto. Apresente como final e esteja pronto para sair. Desconto real conquistado: <b>'+fmt(p-l3)+'</b>.</div>';
  document.getElementById('out').style.display='block';
}
</script>
</body>
</html>
