<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Score de Localização — Praia Digital</title>
<meta name="description" content="Pontue a localização de um imóvel de 0 a 100 com base na proximidade de praia, serviços e transporte.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:660px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1rem;font-size:.95rem}
  .item{margin-bottom:.9rem}
  .item label{display:flex;justify-content:space-between;font-weight:600;font-size:.88rem;margin-bottom:.25rem}
  input[type=range]{width:100%;accent-color:#0077B6}
  button{width:100%;margin-top:1.2rem;padding:.9rem;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  #out{display:none;margin-top:1.2rem;text-align:center}
  .score{font-size:2.6rem;font-weight:800;color:#0077B6}
  .faixa{border-radius:12px;padding:1rem;margin-top:.6rem;font-size:.95rem}
  .bom{background:#dcfce7;border:1px solid #86efac;color:#166534}
  .medio{background:#fef9c3;border:1px solid #fde047;color:#854d0e}
  .ruim{background:#fee2e2;border:1px solid #fca5a5;color:#b91c1c}
  .dica{margin-top:1rem;font-size:.88rem;color:#64748b;text-align:center}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/avaliador-imoveis">← Avaliador IA</a>
</header>
<main>
  <div class="card">
    <h1>📍 Score de Localização</h1>
    <p class="sub">Deslize conforme a distância de cada ponto de interesse:</p>
    <div class="item"><label>🏖️ Praia <span id="vPraia">500m</span></label><input type="range" id="praia" min="0" max="3000" value="500" step="100" oninput="document.getElementById('vPraia').textContent=this.value+'m'"></div>
    <div class="item"><label>🛒 Mercado <span id="vMerc">300m</span></label><input type="range" id="merc" min="0" max="3000" value="300" step="100" oninput="document.getElementById('vMerc').textContent=this.value+'m'"></div>
    <div class="item"><label>🍽️ Restaurantes <span id="vRest">400m</span></label><input type="range" id="rest" min="0" max="3000" value="400" step="100" oninput="document.getElementById('vRest').textContent=this.value+'m'"></div>
    <div class="item"><label>🚌 Transporte/rodovia <span id="vTransp">1000m</span></label><input type="range" id="transp" min="0" max="5000" value="1000" step="200" oninput="document.getElementById('vTransp').textContent=this.value+'m'"></div>
    <div class="item"><label>🏥 Hospital/UPA <span id="vHosp">2000m</span></label><input type="range" id="hosp" min="0" max="10000" value="2000" step="500" oninput="document.getElementById('vHosp').textContent=this.value+'m'"></div>
    <button onclick="calc()">Calcular score</button>
    <div id="out"></div>
    <p class="dica">Combine o score com a <a href="https://praia.digital/avaliador-imoveis/laudo-vistoria/" style="color:#0077B6;font-weight:700">Vistoria Inteligente</a> antes de comprar.</p>
  </div>
</main>
<script>
function pts(v,max){return Math.max(0,1-v/max)}
function calc(){
  var praia=pts(+document.getElementById('praia').value,3000)*35;
  var merc=pts(+document.getElementById('merc').value,3000)*20;
  var rest=pts(+document.getElementById('rest').value,3000)*15;
  var transp=pts(+document.getElementById('transp').value,5000)*15;
  var hosp=pts(+document.getElementById('hosp').value,10000)*15;
  var score=Math.round(praia+merc+rest+transp+hosp);
  var cls,txt;
  if(score>=80){cls='bom';txt='🌟 <b>Localização excepcional.</b> Imóveis assim valorizam acima da média e alugam fácil.';}
  else if(score>=55){cls='medio';txt='👍 <b>Boa localização.</b> Equilíbrio entre conveniência e preço. Compare o m² no <a href="https://praia.digital/avaliador-imoveis/comparador-bairros/" style="color:inherit">Comparador de Bairros</a>.';}
  else{cls='ruim';txt='⚠️ <b>Localização fraca.</b> O preço precisa compensar — negocie firme ou avalie outras opções.';}
  document.getElementById('out').innerHTML='<div class="score">'+score+'/100</div><div class="faixa '+cls+'">'+txt+'</div>';
  document.getElementById('out').style.display='block';
}
</script>
</body>
</html>
