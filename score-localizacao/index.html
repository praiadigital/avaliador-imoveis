<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Score de Localização — Praia Digital</title>
<meta name="description" content="Pontue a localização de um imóvel de 0 a 100 pela proximidade de praia, comércio e serviços.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:660px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1.2rem;font-size:.95rem}
  .item{margin-bottom:1rem}
  .item label{display:flex;justify-content:space-between;font-weight:600;font-size:.88rem;margin-bottom:.3rem}
  .item label span{color:#0077B6;font-weight:800}
  input[type=range]{width:100%;accent-color:#0077B6}
  button{width:100%;margin-top:1.3rem;padding:.9rem;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  #out{display:none;margin-top:1.2rem;text-align:center}
  .score{font-size:3rem;font-weight:800}
  .faixa{border-radius:12px;padding:1rem;margin-top:.6rem;font-size:.95rem}
  .a{background:#dcfce7;border:1px solid #86efac;color:#166534}
  .b{background:#fef9c3;border:1px solid #fde047;color:#854d0e}
  .c{background:#fee2e2;border:1px solid #fca5a5;color:#b91c1c}
  .dica{margin-top:1rem;background:#ecfeff;border:1px solid #67e8f9;border-radius:12px;padding:1rem;font-size:.9rem}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/avaliador-imoveis">← Avaliador IA</a>
</header>
<main>
  <div class="card">
    <h1>📍 Score de Localização</h1>
    <p class="sub">Deslize conforme a proximidade real do imóvel (0 = longe, 10 = na porta).</p>
    <div class="item"><label>Distância da praia <span id="v0">5</span></label><input type="range" min="0" max="10" value="5" oninput="v0.textContent=this.value"></div>
    <div class="item"><label>Mercado/padaria a pé <span id="v1">5</span></label><input type="range" min="0" max="10" value="5" oninput="v1.textContent=this.value"></div>
    <div class="item"><label>Restaurantes e lazer <span id="v2">5</span></label><input type="range" min="0" max="10" value="5" oninput="v2.textContent=this.value"></div>
    <div class="item"><label>Transporte/acesso a SP <span id="v3">5</span></label><input type="range" min="0" max="10" value="5" oninput="v3.textContent=this.value"></div>
    <div class="item"><label>Segurança do bairro <span id="v4">5</span></label><input type="range" min="0" max="10" value="5" oninput="v4.textContent=this.value"></div>
    <button onclick="calc()">Calcular score</button>
    <div id="out"></div>
    <div class="dica">🏠 Combine o score com o valor no <a href="https://praia.digital/avaliador-imoveis" style="color:#0077B6;font-weight:700">Avaliador IA</a> · 📏 <a href="https://praia.digital/avaliador-imoveis/comparador-bairros/" style="color:#0077B6;font-weight:700">Comparador de Bairros</a></div>
  </div>
</main>
<script>
function calc(){
  var pesos=[0.30,0.15,0.15,0.15,0.25]; // praia e seguranca pesam mais
  var s=0;
  for(var i=0;i<5;i++){s+=parseFloat(document.getElementById('v'+i).textContent)*pesos[i];}
  var score=Math.round(s*10);
  var cls,txt;
  if(score>=75){cls='a';txt='🌟 Localização premium — vale pagar mais caro ou cobrar mais na temporada.';}
  else if(score>=50){cls='b';txt='👍 Boa localização — confira o preço por m² do bairro antes de fechar.';}
  else{cls='c';txt='⚠️ Localização fraca — só compensa com desconto significativo.';}
  document.getElementById('out').innerHTML='<div class="score" style="color:#0077B6">'+score+'</div><div class="faixa '+cls+'">'+txt+'</div>';
  document.getElementById('out').style.display='block';
}
</script>
</body>
</html>
