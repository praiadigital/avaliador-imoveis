<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist de Vistoria com Nota — Praia Digital</title>
<meta name="description" content="Vistorie o imóvel antes de comprar: checklist pontuado que gera uma nota de 0 a 100 e um veredito.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:680px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1rem;font-size:.95rem}
  .secao{font-weight:800;color:#0077B6;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;margin:1rem 0 .3rem}
  .chk{display:flex;gap:.6rem;align-items:center;padding:.45rem .6rem;border-radius:8px;cursor:pointer;font-size:.92rem}
  .chk:hover{background:#f1f5f9}
  .chk input{width:auto}
  .chk.no{opacity:.5;text-decoration:line-through}
  button{width:100%;margin-top:1.3rem;padding:.9rem;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  #out{display:none;margin-top:1.2rem;text-align:center}
  .nota{font-size:2.6rem;font-weight:800}
  .verd{border-radius:12px;padding:1rem;margin-top:.6rem;font-size:.95rem}
  .bom{background:#dcfce7;border:1px solid #86efac;color:#166534}
  .medio{background:#fef9c3;border:1px solid #fde047;color:#854d0e}
  .ruim{background:#fee2e2;border:1px solid #fca5a5;color:#b91c1c}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/avaliador-imoveis">← Avaliador IA</a>
</header>
<main>
  <div class="card">
    <h1>🔍 Vistoria Inteligente</h1>
    <p class="sub">Marque o que está OK no imóvel. No final, receba a nota e o veredito de compra.</p>
    <div id="lista"></div>
    <button onclick="avaliar()">Gerar nota do imóvel</button>
    <div id="out"></div>
  </div>
</main>
<script>
var secoes={
  'Estrutura':['Sem infiltrações ou manchas de umidade','Sem rachaduras estruturais','Esquadrias vedam bem (maresia)','Telhado/cobertura em bom estado'],
  'Hidráulica e elétrica':['Torneiras e chuveiros com boa pressão','Sem sinais de curto ou fiação antiga','Disjuntores modernos'],
  'Documentação':['Escritura registrada','IPTU quitado','Sem dívidas de condomínio','Habite-se / averbação ok'],
  'Condomínio e entorno':['Condomínio com reserva financeira','Portaria/segurança funcionando','Rua e entorno bem cuidados']
};
var lista=document.getElementById('lista');
Object.keys(secoes).forEach(function(s){
  var h=document.createElement('p');h.className='secao';h.textContent=s;lista.appendChild(h);
  secoes[s].forEach(function(item){
    var l=document.createElement('label');l.className='chk';
    var cb=document.createElement('input');cb.type='checkbox';cb.checked=true;
    cb.onchange=function(){l.classList.toggle('no',!cb.checked)};
    l.appendChild(cb);l.appendChild(document.createTextNode(item));
    lista.appendChild(l);
  });
});
function avaliar(){
  var cbs=lista.querySelectorAll('input');
  var ok=0;cbs.forEach(function(c){if(c.checked)ok++});
  var nota=Math.round(ok/cbs.length*100);
  var cls,verd;
  if(nota>=85){cls='bom';verd='✅ <b>Verde para comprar!</b> Imóvel em ótimo estado e documentação limpa.';}
  else if(nota>=60){cls='medio';verd='⚠️ <b>Compre com negociação.</b> Há pontos de atenção — use-os para pedir desconto no <a href="https://praia.digital/avaliador-imoveis/simulador-negociacao/" style="color:inherit">Simulador de Negociação</a>.';}
  else{cls='ruim';verd='🛑 <b>Sinal amarelo forte.</b> Muitos problemas — peça laudo profissional ou considere outro imóvel.';}
  document.getElementById('out').innerHTML='<div class="nota" style="color:#0077B6">'+nota+'/100</div><div class="verd '+cls+'">'+verd+'</div>';
  document.getElementById('out').style.display='block';
}
</script>
</body>
</html>
